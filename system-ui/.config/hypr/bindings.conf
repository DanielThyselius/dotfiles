# Application bindings
bindd = SUPER, RETURN, Terminal, exec, uwsm-app -- xdg-terminal-exec --dir="$(omarchy-cmd-terminal-cwd)"
bindd = SUPER ALT, RETURN, Tmux, exec, uwsm-app -- xdg-terminal-exec --dir="$(omarchy-cmd-terminal-cwd)" bash -c "tmux attach || tmux new -s Work"
bindd = SUPER SHIFT, RETURN, Browser, exec, omarchy-launch-browser
bindd = SUPER SHIFT, F, File manager, exec, uwsm-app -- nautilus --new-window
bindd = SUPER ALT SHIFT, F, File manager (cwd), exec, uwsm-app -- nautilus --new-window "$(omarchy-cmd-terminal-cwd)"
bindd = SUPER SHIFT, B, Browser, exec, omarchy-launch-browser
bindd = SUPER SHIFT ALT, B, Browser (private), exec, omarchy-launch-browser --private
bindd = SUPER SHIFT, M, Music, exec, omarchy-launch-or-focus spotify
bindd = SUPER SHIFT, N, Editor, exec, omarchy-launch-editor
bindd = SUPER SHIFT, D, Docker, exec, omarchy-launch-tui lazydocker
# bindd = SUPER SHIFT, G, Signal, exec, omarchy-launch-or-focus ^signal$ "uwsm-app -- signal-desktop"
bindd = SUPER SHIFT, O, Obsidian, exec, omarchy-launch-or-focus ^obsidian$ "uwsm-app -- obsidian -disable-gpu --enable-wayland-ime"
bindd = SUPER SHIFT, W, Typora, exec, uwsm-app -- typora --enable-wayland-ime
bindd = SUPER SHIFT, SLASH, Passwords, exec, uwsm-app -- 1password

# If your web app url contains #, type it as ## to prevent hyprland treating it as a comment
bindd = SUPER SHIFT, A, ChatGPT, exec, omarchy-launch-webapp "https://chatgpt.com"
bindd = SUPER SHIFT ALT, A, Grok, exec, omarchy-launch-webapp "https://grok.com"
bindd = SUPER SHIFT, C, Calendar, exec, omarchy-launch-webapp "https://app.hey.com/calendar/weeks/"
bindd = SUPER SHIFT, E, Email, exec, omarchy-launch-webapp "https://app.hey.com"
bindd = SUPER SHIFT, Y, YouTube, exec, omarchy-launch-webapp "https://youtube.com/"
bindd = SUPER SHIFT ALT, G, WhatsApp, exec, omarchy-launch-or-focus-webapp WhatsApp "https://web.whatsapp.com/"
# bindd = SUPER SHIFT CTRL, G, Google Messages, exec, omarchy-launch-or-focus-webapp "Google Messages" "https://messages.google.com/web/conversations"
bindd = SUPER SHIFT, P, Google Photos, exec, omarchy-launch-or-focus-webapp "Google Photos" "https://photos.google.com/"
bindd = SUPER SHIFT, X, X, exec, omarchy-launch-webapp "https://x.com/"
bindd = SUPER SHIFT ALT, X, X Post, exec, omarchy-launch-webapp "https://x.com/compose/post"

# Move window with SUPER + SHIFT + arrows (was: swap window)
unbind = SUPER SHIFT, LEFT
unbind = SUPER SHIFT, RIGHT
unbind = SUPER SHIFT, UP
unbind = SUPER SHIFT, DOWN
bindd = SUPER SHIFT, LEFT, Move window left, swapwindow, l
bindd = SUPER SHIFT, RIGHT, Move window right, swapwindow, r
bindd = SUPER SHIFT, UP, Move window up, swapwindow, u
bindd = SUPER SHIFT, DOWN, Move window down, swapwindow, d

# Resize with SUPER + CTRL + arrows (was: group navigation)
unbind = SUPER CTRL, LEFT
unbind = SUPER CTRL, RIGHT
unbind = SUPER CTRL, UP
unbind = SUPER CTRL, DOWN
bindd = SUPER CTRL, LEFT, Resize window left, resizeactive, -100 0
bindd = SUPER CTRL, RIGHT, Resize window right, resizeactive, 100 0
bindd = SUPER CTRL, UP, Resize window up, resizeactive, 0 -100
bindd = SUPER CTRL, DOWN, Resize window down, resizeactive, 0 100

# Move window into group with SUPER + CTRL + SHIFT + arrows (was: group join on SUPER+ALT)
unbind = SUPER ALT, LEFT
unbind = SUPER ALT, RIGHT
unbind = SUPER ALT, UP
unbind = SUPER ALT, DOWN
bindd = SUPER CTRL SHIFT, LEFT, Move window into group left, moveintogroup, l
bindd = SUPER CTRL SHIFT, RIGHT, Move window into group right, moveintogroup, r
bindd = SUPER CTRL SHIFT, UP, Move window into group up, moveintogroup, u
bindd = SUPER CTRL SHIFT, DOWN, Move window into group down, moveintogroup, d

# SUPER + TAB = former workspace (was: next workspace)
unbind = SUPER, TAB
unbind = SUPER SHIFT, TAB
unbind = SUPER CTRL, TAB
bindd = SUPER, TAB, Former workspace, workspace, previous

# SUPER + CTRL + TAB = cycle grouped windows (was: former workspace)
bindd = SUPER CTRL, TAB, Next window in group, changegroupactive, f
bindd = SUPER CTRL SHIFT, TAB, Previous window in group, changegroupactive, b

# Move window out of group (was: SUPER+ALT+G)
unbind = SUPER ALT, G
bindd = SUPER SHIFT, G, Move window out of group, moveoutofgroup

# Cycle grouped windows with SUPER + ALT + arrows (was: group join)
bindd = SUPER ALT, LEFT, Previous window in group, changegroupactive, b
bindd = SUPER ALT, RIGHT, Next window in group, changegroupactive, f

# Vox dictation on SUPER + Z (was: SUPER+CTRL+X)
unbind = SUPER CTRL, X
bindd = SUPER, Z, Toggle dictation, exec, voxtype record toggle

# Send window to scratchpad on SUPER+SHIFT+S (was: SUPER+ALT+S)
unbind = SUPER ALT, S
bindd = SUPER SHIFT, S, Move window to scratchpad, movetoworkspacesilent, special:scratchpad

# Lock screen on SUPER+L (was: toggle workspace layout) and move layout toggle to SUPER+SHIFT+L
unbind = SUPER, L
bindd = SUPER, L, Lock screen, exec, omarchy-lock-screen
bindd = SUPER SHIFT, L, Toggle workspace layout, exec, omarchy-hyprland-workspace-layout-toggle

# Free ALT+TAB / ALT+SHIFT+TAB for tmux (was: cycle windows + bring active to top)
unbind = ALT, TAB
unbind = ALT SHIFT, TAB

# Add extra bindings
# bind = SUPER SHIFT, R, exec, alacritty -e ssh your-server

# Overwrite existing bindings, like putting Omarchy Menu on Super + Space
# unbind = SUPER, SPACE
# bindd = SUPER, SPACE, Omarchy menu, exec, omarchy-menu
