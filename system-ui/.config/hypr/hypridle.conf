general {
    lock_cmd = omarchy-system-lock                         # lock screen and 1password
    before_sleep_cmd = OMARCHY_LOCK_ONLY=true omarchy-system-lock    # lock before suspend without scheduling display off.
    after_sleep_cmd = sleep 1 && omarchy-system-wake                 # delay for PAM readiness, then turn on display.
    inhibit_sleep = 3                                      # wait until screen is locked
}

# Start screensaver after 2.5 minutes
listener {
    timeout = 150
    on-timeout = pidof hyprlock || omarchy-launch-screensaver
}

# Lock system after 5 minutes (screensaver resets idle timer, so have to just do half + 2s margin)
listener {
    timeout = 152
    on-timeout = omarchy-system-lock
    on-resume = omarchy-system-wake
}

# Turn the display off after ~5.5 minutes idle (the panel is the biggest battery draw)
listener {
    timeout = 330
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}

# Suspend after 15 minutes idle. Prefer suspend-then-hibernate (RAM first, then to
# disk if it keeps draining); fall back to plain suspend if hibernation isn't available
# yet (so this still works before the initramfs resume hook + UPower changes land).
# This whole daemon stops when idle-lock is toggled off (SUPER+CTRL+L), so suspend is
# coupled to screen locking. The <10% hibernate floor is separate (UPower) and always on.
listener {
    timeout = 900
    on-timeout = systemctl suspend-then-hibernate || systemctl suspend
    on-resume = omarchy-system-wake
}
