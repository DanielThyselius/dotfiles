# Control your input devices
# See https://wiki.hypr.land/Configuring/Variables/#input
input {
  # Use multiple keyboard layouts and switch between them with Left Alt + Right Alt
  # kb_layout = us,dk,eu

  # Use a specific keyboard variant if needed (e.g. intl for international keyboards)
  # kb_variant = intl

  kb_layout = se
  kb_options = compose:caps # ,grp:alts_toggle

  # Change speed of keyboard repeat
  repeat_rate = 40
  repeat_delay = 600

  # Start with numlock on by default
  numlock_by_default = true

  # Focus follows mouse hover. Paired with touchpad disable_while_typing below
  # so palm/wrist touches during typing don't shift focus.
  follow_mouse = 1

  # Increase sensitivity for mouse/trackpad (default: 0, range -1.0 to 1.0)
  sensitivity = 0.3

  # Turn off mouse acceleration (default: false)
  # force_no_accel = true

  touchpad {
    # Use natural (inverse) scrolling
    natural_scroll = true

    # Use two-finger clicks for right-click instead of lower-right corner
    # clickfinger_behavior = true

    # Control the speed of your scrolling
    scroll_factor = 0.4

    # Ignore touchpad while keys are being pressed — prevents palm/wrist
    # touches from moving the cursor (and tripping follow_mouse = 1).
    disable_while_typing = true

    # Left-click-and-drag with three fingers
    # drag_3fg = 1
  }
}

# Scroll nicely in the terminal
windowrule = match:class (Alacritty|kitty|foot), scroll_touchpad 2.25
windowrule = match:class com.mitchellh.ghostty, scroll_touchpad 0.3

# Speed up scrolling on the external mouse only (leave trackpad alone).
# tmux is configured to scroll 1 line per wheel event (touchpad-friendly), so
# the multiplier here is what gives the mouse wheel its per-notch line count.
# Names must match `hyprctl devices` exactly — the undocked endpoint now
# enumerates as plain `razer-razer-viper-ultimate` (older builds appended
# `-dongle-1`); the dock endpoint is kept below for the docked case.
device {
    name = razer-razer-viper-ultimate-1
    scroll_factor = 5.0
}
device {
    name = razer-razer-viper-ultimate-dongle-1
    scroll_factor = 5.0
}
device {
    name = razer-razer-mouse-dock-1
    scroll_factor = 5.0
}

# Enable touchpad gestures for changing workspaces
# See https://wiki.hyprland.org/Configuring/Gestures/
gesture = 3, horizontal, workspace

# 3-finger swipe up/down: workspace overview — DISABLED 2026-06-01
# (no overview plugin builds on Hyprland 0.55.2; see note in hyprland.conf)
# gesture = 3, up, dispatcher, hyprtasking:toggle, cursor
# gesture = 3, down, dispatcher, hyprtasking:toggle, cursor

# Enable touchpad gestures for moving focus (helpful on scrolling layout)
# gesture = 3, left,  dispatcher, movefocus, l
# gesture = 3, right, dispatcher, movefocus, r
