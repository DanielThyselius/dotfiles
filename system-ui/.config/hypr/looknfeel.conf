# Change the default Omarchy look'n'feel

# https://wiki.hyprland.org/Configuring/Variables/#general
general {
    # No gaps between windows or borders
    gaps_in = 0
    gaps_out = 0
    border_size = 1

    # Don't wrap focus when reaching the edge
    no_focus_fallback = true

    # Change to niri-like side-scrolling layout
    # layout = scrolling
}

# https://wiki.hyprland.org/Configuring/Variables/#decoration
decoration {
    # Use round window corners
    # rounding = 8

    # Dim unfocused windows (0.0 = no dim, 1.0 = fully dimmed)
    dim_inactive = true
    dim_strength = 0.15
}

# https://wiki.hyprland.org/Configuring/Variables/#animations
animations {
    # Disable all animations
    # enabled = no
}

# https://wiki.hypr.land/Configuring/Variables/#layout
layout {
    # Avoid overly wide single-window layouts on wide screens
    # single_window_aspect_ratio = 1 1
}

# Remove border when only one window is on the workspace
windowrule = border_size 0, match:float 0, match:workspace w[tv1]
windowrule = border_size 0, match:float 0, match:workspace f[1]

# Don't teleport the cursor to the center when changing workspace
cursor {
    warp_on_change_workspace = 0
}

dwindle {
    # Spawn new tiles based on the focused window's aspect ratio (Omarchy
    # default force_split = 2). `smart_split` would override this with the
    # cursor's position, which is wrong for launcher/keyboard spawns.
    # `precise_mouse_move` re-enables cursor-position placement, but only
    # for mouse drag-and-drop — exactly what we want.
    smart_split = false
    precise_mouse_move = true
}

# Floating popup placement — scratchpad apps anchored to side
# Bitwarden: right-anchored, vertically centered.
# Drop omarchy's `floating-window` tag so its `center on` and `size 875 600`
# rules don't fight our explicit positioning.
windowrule = tag -floating-window,                           match:class ^Bitwarden$
windowrule = float on,                                       match:class ^Bitwarden$
windowrule = workspace special:scratchpad,                   match:class ^Bitwarden$
windowrule = size 980 900,                                   match:class ^Bitwarden$
windowrule = move 1048 190,                                  match:class ^Bitwarden$

# brain.fm PWA: left-anchored, vertically centered
windowrule = float on,                                       match:class .*dcllmfmjlkpljanfegjgohmlnfipachj.*
windowrule = workspace special:scratchpad,                   match:class .*dcllmfmjlkpljanfegjgohmlnfipachj.*
windowrule = size 500 800,                                   match:class .*dcllmfmjlkpljanfegjgohmlnfipachj.*
windowrule = move 20 ((monitor_h-window_h)/2),               match:class .*dcllmfmjlkpljanfegjgohmlnfipachj.*

# Spotify: centered on monitor
windowrule = float on,                                       match:class ^Spotify$
windowrule = workspace special:scratchpad,                   match:class ^Spotify$
windowrule = size 1170 844,                                  match:class ^Spotify$
windowrule = move 439 218,                                   match:class ^Spotify$
