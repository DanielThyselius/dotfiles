# See https://wiki.hyprland.org/Configuring/Monitors/
# List current monitors and resolutions possible: hyprctl monitors
# Format: monitor = [port], resolution, position, scale

# Optimized for retina-class 2x displays, like 13" 2.8K, 27" 5K, 32" 6K.
env = GDK_SCALE,

monitor = HDMI-A-1, 2560x1440@144, 0x0, 1
monitor = DP-1, preferred, 0x0, 1
monitor = DP-2, preferred, 0x0, 1
monitor = eDP-1, 2560x1600@300, 0x1440, 1.25

# Pin workspaces 7, 8, 9 to the external monitor.
# Hyprland only allows one rule per workspace id, so the port name has to
# match what's actually connected — adjust if the external comes up on
# a different port (HDMI-A-1, DP-1, DP-2, ...).
workspace = 7, monitor:DP-2, default:true
workspace = 8, monitor:DP-2
workspace = 9, monitor:DP-2
