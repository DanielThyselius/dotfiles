# See https://wiki.hyprland.org/Configuring/Monitors/
# List current monitors and resolutions possible: hyprctl monitors
# Format: monitor = [port], resolution, position, scale

# Optimized for retina-class 2x displays, like 13" 2.8K, 27" 5K, 32" 6K.
env = GDK_SCALE,

monitor = HDMI-A-1, 2560x1440@144, 0x0, 1
monitor = DP-1, preferred, 0x0, 2
monitor = DP-2, preferred, 0x0, 1.5
# Laptop position is set for the home HDMI stacked layout (below external,
# left-aligned). Office DP-1/DP-2 setups expect laptop to the right — when
# switching setups, this position needs to change too.
monitor = eDP-1, 2560x1600@300, 0x1440, 1.25

# Workspace layout (all persistent → always visible in hyprexpo overview):
#   1-5   → laptop (eDP-1)
#   6-10  → home external on HDMI-A-1
# Hyprland only allows one rule per workspace id; in non-home setups (e.g.
# DP at the office) workspaces 6-10 won't follow the external automatically.
workspace = 1, monitor:eDP-1, persistent:true, default:true
workspace = 2, monitor:eDP-1, persistent:true
workspace = 3, monitor:eDP-1, persistent:true
workspace = 4, monitor:eDP-1, persistent:true
workspace = 5, monitor:eDP-1, persistent:true
workspace = 6, monitor:HDMI-A-1, persistent:true, default:true
workspace = 7, monitor:HDMI-A-1, persistent:true
workspace = 8, monitor:HDMI-A-1, persistent:true
workspace = 9, monitor:HDMI-A-1, persistent:true
workspace = 10, monitor:HDMI-A-1, persistent:true
