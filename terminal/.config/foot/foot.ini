[main]
include=~/.local/state/omarchy/current/theme/foot.ini
term=xterm-256color
font=JetBrainsMono Nerd Font:size=9
pad=14x14
initial-window-mode=windowed
workers=0

[scrollback]
lines=10000
multiplier=7.0

[cursor]
style=block
blink=no

[key-bindings]
clipboard-copy=Control+Insert Control+Shift+c XF86Copy
primary-paste=none
clipboard-paste=Shift+Insert Control+Shift+v XF86Paste
# URL mode with jump labels: alt+o opens, alt+c copies (replaces Ghostty's
# copy_url_to_clipboard hover bind). foot eats these before any app sees them:
# alt+c shadows readline's capitalize-word, alt+o shadows Claude Code's
# fast-mode toggle (also reachable as /fast). Finish a copy label with an
# uppercase letter to also paste it into the prompt; t toggles showing targets.
show-urls-launch=Mod1+o Control+Shift+o
show-urls-copy=Mod1+c

[text-bindings]
# Send Shift+Return as CSI-u so TUIs can distinguish it from Return.
\x1b[13;2u=Shift+Return
# Send Alt+Shift+Return as CSI-u so tmux can match M-S-Enter.
\x1b[13;4u=Mod1+Shift+Return
# Ctrl+Backspace sends the Alt+Backspace bytes (ESC DEL): delete previous
# word in bash, nvim and Claude Code. Same remap the Ghostty config had.
\x1b\x7f=Control+BackSpace

[url]
# OSC 8 links (Claude Code file links, herdr) get a visible underline at all
# times instead of only inside URL mode (ctrl+shift+o). foot never makes them
# mouse-clickable; herdr handles ctrl+click itself via the open-editor-links
# plugin, and ctrl+shift+o remains the keyboard way to open any visible link.
osc8-underline=always
