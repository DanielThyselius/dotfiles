id = "agent-priority"
name = "Agent priority"
version = "1.0.0"
description = "Re-apply stored agent priorities to the sidebar after a restart"
min_herdr_version = "0.8.0"
platforms = ["linux"]

# Priorities are shown as the $pri metadata token on each agent row, and herdr
# rebuilds metadata tokens as empty on session restore (persist/restore.rs), so
# without this hook every priority would look unset after a restart while the
# store still held it. [[startup]] runs once the session is restored and the
# socket is ready, which is exactly when the tokens need re-projecting.
#
# LOOP HAZARD: the script writes back into herdr with `pane report-metadata`,
# which fires pane.updated and *.metadata_updated. No event hook here, and none
# should be added — a metadata hook would re-trigger itself forever. Startup is
# the only safe moment to bulk-stamp.
[[startup]]
command = ["sh", "-c", "$HOME/.config/herdr/herdr-agent-priority.sh stamp"]

# A newly detected agent has no sort token yet, and an agent with no sort token
# sorts below every ranked one instead of sitting at the default middle. stamp
# is idempotent and only writes where a value is actually wrong, so this costs
# one API call in the normal case.
#
# pane.agent_detected is safe to hook for the same reason herdr-number-sidebar
# hooks it: it is not re-fired by report-metadata. Never hook pane.updated or
# the metadata events.
[[events]]
on = "pane.agent_detected"
command = ["sh", "-c", "$HOME/.config/herdr/herdr-agent-priority.sh stamp"]

# The ranked view, opened with prefix+p. A popup rather than an overlay because
# a popup is session-modal and receives every keystroke including Escape, which
# is what fzf needs, and because it is not a real pane: no pane id, no lifecycle
# events, no layout change to undo afterwards.
[[panes]]
id = "picker"
title = "Agent priority"
placement = "popup"
width = "80%"
height = "60%"
command = ["sh", "-c", "$HOME/.config/herdr/herdr-agent-priority.sh pick"]
