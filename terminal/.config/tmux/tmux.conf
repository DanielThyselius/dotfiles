# Prefix
set -g prefix C-Space
set -g prefix2 M-Space
bind C-Space send-prefix
bind M-Space send-prefix -2

# Reload config
bind q source-file ~/.config/tmux/tmux.conf

# Vi mode for copy
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# Scroll 3 lines per mouse-wheel notch in copy mode
bind -T copy-mode-vi WheelUpPane   send-keys -X -N 3 scroll-up
bind -T copy-mode-vi WheelDownPane send-keys -X -N 3 scroll-down

# Pane Controls
bind -n M-Enter split-window -v -c "#{pane_current_path}"
bind -n M-S-Enter split-window -h -c "#{pane_current_path}"
bind -n M-Escape kill-pane
bind h split-window -v -c "#{pane_current_path}"
bind -n M-m split-window -v -c "#{pane_current_path}"
bind -n C-M-S-Up split-window -vb -c "#{pane_current_path}"
bind -n C-M-S-Down split-window -v -c "#{pane_current_path}"
bind v split-window -h -c "#{pane_current_path}"
bind -n M-n split-window -h -c "#{pane_current_path}"
bind -n C-M-S-Left split-window -hb -c "#{pane_current_path}"
bind -n C-M-S-Right split-window -h -c "#{pane_current_path}"
bind x kill-pane
bind -n M-w kill-pane

# Focus panes: arrows or hjkl, never wrap at screen edge
bind -n M-Left if -F '#{pane_at_left}' '' 'select-pane -L'
bind -n M-Right if -F '#{pane_at_right}' '' 'select-pane -R'
bind -n M-Up if -F '#{pane_at_top}' '' 'select-pane -U'
bind -n M-Down if -F '#{pane_at_bottom}' '' 'select-pane -D'
bind -n M-h if -F '#{pane_at_left}' '' 'select-pane -L'
bind -n M-l if -F '#{pane_at_right}' '' 'select-pane -R'
bind -n M-k if -F '#{pane_at_top}' '' 'select-pane -U'
bind -n M-j if -F '#{pane_at_bottom}' '' 'select-pane -D'

# Swap panes with neighbor: arrows or Shift+hjkl (capital letters)
bind -n M-S-Left swap-pane -t '{left-of}' \; select-pane -t '{left-of}'
bind -n M-S-Right swap-pane -t '{right-of}' \; select-pane -t '{right-of}'
bind -n M-S-Up swap-pane -t '{up-of}' \; select-pane -t '{up-of}'
bind -n M-S-Down swap-pane -t '{down-of}' \; select-pane -t '{down-of}'
bind -n M-H swap-pane -t '{left-of}' \; select-pane -t '{left-of}'
bind -n M-L swap-pane -t '{right-of}' \; select-pane -t '{right-of}'
bind -n M-K swap-pane -t '{up-of}' \; select-pane -t '{up-of}'
bind -n M-J swap-pane -t '{down-of}' \; select-pane -t '{down-of}'

# Resize pane: Ctrl+Alt+arrows or Ctrl+Alt+hjkl
bind -n M-C-Left resize-pane -L 5
bind -n M-C-Right resize-pane -R 5
bind -n M-C-Up resize-pane -U 5
bind -n M-C-Down resize-pane -D 5
bind -n C-M-h resize-pane -L 5
bind -n C-M-l resize-pane -R 5
bind -n C-M-k resize-pane -U 5
bind -n C-M-j resize-pane -D 5

# Split in direction: Ctrl+Alt+Shift+arrows or Ctrl+Alt+Shift+hjkl (capital letters)
bind -n C-M-H split-window -hb -c "#{pane_current_path}"
bind -n C-M-L split-window -h -c "#{pane_current_path}"
bind -n C-M-K split-window -vb -c "#{pane_current_path}"
bind -n C-M-J split-window -v -c "#{pane_current_path}"

# Window navigation
bind r command-prompt "rename-window -- '%%'"
bind -n M-r command-prompt "rename-window -- '%%'"
bind -n M-R run-shell 'name=$(tmux display-message -p "#W"); tmux command-prompt -I "$name:" "rename-window -- \"%%\""'
bind -n C-M-r setw automatic-rename on
# prefix+c enters copy mode (scrollback/selection). New-window lives on M-t.
# Kept later than any earlier `bind c` so this wins (last binding takes effect).
# prefix+[ still enters copy mode too (tmux default).
bind c copy-mode
bind -n M-t new-window -c "#{pane_current_path}"
bind -n M-T break-pane
bind -n C-M-t break-pane -d
bind -n C-M-T break-pane -d
bind k kill-window

# Cycle windows with Alt+Tab/Alt+a (next) and Alt+Shift+Tab/Alt+A (prev)
bind -n M-Tab next-window
bind -n M-S-Tab previous-window
bind -n M-BTab previous-window
bind -n M-a next-window
bind -n M-A previous-window
bind -n M-q last-window

# Move (swap) current window right/left with Ctrl+Alt+Tab and Ctrl+Alt+Shift+Tab.
# Hyprland's stock CTRL+ALT+Tab (focusmonitor) is unbound in ~/.config/hypr/bindings.conf
# so these reach tmux. Revisit once a second monitor is in play.
bind -n C-M-Tab   swap-window -d -t +1
bind -n C-M-S-Tab swap-window -d -t -1
bind -n C-M-BTab  swap-window -d -t -1

bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9
bind -n M-0 select-window -t 10

bind 1 join-pane -t :1
bind 2 join-pane -t :2
bind 3 join-pane -t :3
bind 4 join-pane -t :4
bind 5 join-pane -t :5
bind 6 join-pane -t :6
bind 7 join-pane -t :7
bind 8 join-pane -t :8
bind 9 join-pane -t :9
bind 0 join-pane -t :10

# Move active pane to window N and follow focus (mimics SUPER+SHIFT+N movetoworkspace)
# Keys are the Swedish-layout shifted digits (Shift+1..0 → ! " # ¤ % & / ( ) =)
bind -n M-!   join-pane -t :1  \; select-window -t :1
bind -n 'M-"' join-pane -t :2  \; select-window -t :2
bind -n 'M-#' join-pane -t :3  \; select-window -t :3
# Window 4: Ghostty drops Shift on Alt+Shift+4 (sends legacy ESC+4, colliding
# with M-4) and Ctrl can't be cleanly encoded with ¤ via the M- prefix. So we
# force Ghostty to emit explicit kitty-CSI-u sequences (see ghostty/config) and
# match those raw bytes here. Mod mask: shift=1, alt=2, ctrl=4. 164 = U+00A4 (¤).
set -s user-keys[0] "\e[164;3u"
set -s user-keys[1] "\e[164;7u"
bind -n User0 join-pane -t :4  \; select-window -t :4
bind -n 'M-%' join-pane -t :5  \; select-window -t :5
bind -n 'M-&' join-pane -t :6  \; select-window -t :6
bind -n M-/   join-pane -t :7  \; select-window -t :7
bind -n 'M-(' join-pane -t :8  \; select-window -t :8
bind -n 'M-)' join-pane -t :9  \; select-window -t :9
bind -n M-=   join-pane -t :10 \; select-window -t :10

# Move active pane to window N silently, keep focus on current window (mimics SUPER+SHIFT+ALT+N movetoworkspacesilent)
bind -n C-M-!   join-pane -t :1
bind -n 'C-M-"' join-pane -t :2
bind -n 'C-M-#' join-pane -t :3
bind -n User1   join-pane -t :4
bind -n 'C-M-%' join-pane -t :5
bind -n 'C-M-&' join-pane -t :6
bind -n C-M-/   join-pane -t :7
bind -n 'C-M-(' join-pane -t :8
bind -n 'C-M-)' join-pane -t :9
bind -n C-M-=   join-pane -t :10

#bind -n C-M-Left select-window -t -1
#bind -n C-M-Right select-window -t +1
#bind -n C-M-S-Left swap-window -t -1 \; select-window -t -1
#bind -n C-M-S-Right swap-window -t +1 \; select-window -t +1

# Workaround for Ghostty 1.3.x on Linux/GTK: the first left mouse-down is
# suppressed by GTK's focus-transfer logic (ghostty-org/ghostty#11342), so
# tmux never sees MouseDown1Pane and the pane doesn't switch until the
# second click. Right-click is unaffected. Bind the pane-select action to
# MouseUp1Pane as well, so the release event still focuses the pane.
# Remove once the upstream GTK fix lands (only macOS got the 1.3.1 fix).
bind -T root MouseUp1Pane if-shell -F '#{||:#{pane_in_mode},#{mouse_any_flag}}' \
    'select-pane -t = ; send-keys -M' \
    'select-pane -t ='
# Restore tmux's default copy-mode click handling so MouseDrag1Pane can begin
# a selection. (An earlier override here cancelled copy-mode on MouseDown1Pane,
# which fired before drag detection and made click-and-drag-select impossible.)
bind -T copy-mode-vi MouseDown1Pane select-pane

# Don't cancel copy-mode after a drag-select — the default `copy-pipe-and-cancel`
# snaps the view back to the live shell, losing your scroll position. Copy and
# clear the highlight, but stay in copy-mode at the same scroll position. Press
# `q` (or Enter) to exit when done.
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe

# Scroll 1 line per wheel event (default is 5) for a more analog touchpad feel.
# Apps on the alternate screen (vim, less, htop) handle scroll themselves.
bind -T root WheelUpPane   if -F '#{||:#{mouse_any_flag},#{pane_in_mode}}' 'send-keys -M' 'if -F "#{alternate_on}" "send-keys -N 1 Up" "copy-mode -e ; send-keys -X -N 1 scroll-up"'
bind -T root WheelDownPane if -F '#{||:#{mouse_any_flag},#{pane_in_mode}}' 'send-keys -M' 'if -F "#{alternate_on}" "send-keys -N 1 Down" ""'
bind -T copy-mode-vi WheelUpPane   select-pane \; send-keys -X -N 1 scroll-up
bind -T copy-mode-vi WheelDownPane select-pane \; send-keys -X -N 1 scroll-down

# Session controls
bind R command-prompt -I "#S" "rename-session -- '%%'"
bind C new-session -c "#{pane_current_path}"
bind K kill-session
bind P switch-client -p
bind N switch-client -n

#bind -n C-M-Up switch-client -p
#bind -n C-M-Down switch-client -n

# General
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",*:RGB"
set -as terminal-features ",*:hyperlinks"
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 50000
set -g escape-time 0
set -g focus-events on
set -g set-clipboard on
set -g extended-keys on
set -g allow-passthrough on
setw -g aggressive-resize on
set -g detach-on-destroy off

# Status bar
set -g status-position top
set -g status-interval 5
set -g status-left-length 30
set -g status-right-length 50
set -g window-status-separator ""
set -gw automatic-rename on
set -gw automatic-rename-format '#{b:pane_current_path}'
set -g set-titles on
set -g set-titles-string '#h:#W'

# Theme
set -g status-style "bg=default,fg=default"
set -g status-left "#[fg=black,bg=blue,bold] #S #[bg=default] "
set -g status-right "#[fg=blue]#{?pane_in_mode,COPY ,}#{?client_prefix,PREFIX ,}#{?window_zoomed_flag,ZOOM ,}#[fg=brightblack]#h "
set -g window-status-format "#[fg=brightblack] #I:#W "
set -g window-status-current-format "#[fg=blue,bold] #I:#W "
set -g pane-border-style "fg=brightblack"
set -g pane-border-indicators arrows
set -g pane-active-border-style "fg=blue"
set -g pane-border-status bottom
set -g pane-border-format "#{?pane_active,#[fg=blue#,bold],#[fg=brightblack]} #P #{pane_current_command} "
set -g message-style "bg=default,fg=blue"
set -g message-command-style "bg=default,fg=blue"
set -g mode-style "bg=blue,fg=black"
setw -g clock-mode-colour blue

# tmux-thumbs: hint-mode picker for URLs/paths/hashes (prefix+Space)
# Lowercase hint: copy match to Wayland clipboard
# Uppercase hint (Shift+letter): open match via ~/.local/bin/tmux-open-hint --
# URLs go to xdg-open; relative paths resolve against the pane cwd, then open in
# Typora (.md) or nvim in a new Ghostty window, honouring a path:LINE suffix.
set -g @thumbs-command 'wl-copy -- {}'
set -g @thumbs-upcase-command '~/.local/bin/tmux-open-hint {} >/dev/null 2>&1 &'
run-shell ~/.config/tmux/plugins/tmux-thumbs/tmux-thumbs.tmux

# Persistence: resurrect (manual save/restore: prefix+Ctrl-s / prefix+Ctrl-r)
# + continuum (auto-save every 10 min, auto-restore on server start).
# Server is meant to run as a systemd user service (tmux.service) detached from
# the graphical session, so a compositor/logind crash no longer kills it.
set -g exit-empty off
set -ga update-environment "WAYLAND_DISPLAY HYPRLAND_INSTANCE_SIGNATURE"
set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '10'
run-shell ~/.config/tmux/plugins/tmux-resurrect/resurrect.tmux
run-shell ~/.config/tmux/plugins/tmux-continuum/continuum.tmux
