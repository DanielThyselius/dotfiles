# Tell Claude Code (and anything using the supports-hyperlinks npm check) to
# emit OSC 8 links. Detection otherwise keys off TERM_PROGRAM, which foot
# does not set, so inside foot/herdr panes links degraded to "text (url)".
# foot shows OSC 8 links in URL mode (ctrl+shift+o) and herdr opens them on
# ctrl+click via the open-editor-links plugin. Session-wide from next login;
# the same export in ~/.bashrc covers shells opened before that.
FORCE_HYPERLINK=1
